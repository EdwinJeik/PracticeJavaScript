<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
  crossorigin=""/>
</head>
<body>

  <!-- Encabezado Principal y Buscador -->
  <header class="header">
    <div class="header-content">
      <h1>IP Address Tracker</h1>
      
      <!-- Formulario de búsqueda -->
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="ip-input" 
          placeholder="Search for any IP address or domain" 
          autocomplete="off"
        />
        <button type="submit" id="search-btn" aria-label="Search">
          <img src="./images/icon-arrow.svg" alt="Arrow icon" />
        </button>
      </form>
    </div>
  </header>

  <!-- Tarjeta Flotante de Información -->
  <section class="tracker-card">
    <div class="info-group">
      <span class="info-title">IP Address</span>
      <h2 id="ip-result">192.212.174.101</h2>
    </div>
    
    <div class="separator"></div>

    <div class="info-group">
      <span class="info-title">Location</span>
      <h2 id="location-result">Brooklyn, NY 10001</h2>
    </div>

    <div class="separator"></div>

    <div class="info-group">
      <span class="info-title">Timezone</span>
      <h2 id="timezone-result">UTC -05:00</h2>
    </div>

    <div class="separator"></div>

    <div class="info-group">
      <span class="info-title">ISP</span>
      <h2 id="isp-result">SpaceX Starlink</h2>
    </div>
  </section>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
      crossorigin="">
   </script>

   <script src="script.js"></script>
  

</body>
</html>
